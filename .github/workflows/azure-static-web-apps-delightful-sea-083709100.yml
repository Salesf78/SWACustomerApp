name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_SEA_083709100 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional, Leave blank if no Azure Functions
          # data_api_location: "swa-db-connections" # Correct property for DAB configs
          output_location: "dist" # Built app content directory - optional
          skip_api_build: true       # ✅ CRUCIAL: Bypasses the native SWA builder so your standalone BYO App handles execution
          ###### End of Repository/Build Configurations ######
        
        # ✅ FIXED: Moved out of the "with" block and indented correctly
        env: 
          DAB_AUTH_PROVIDER: StaticWebApps

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_SEA_083709100 }}
          action: "close"
          
  # New job to handle deploying your custom backend code to your standalone app
  deploy_backend_job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy Backend to Standalone Function
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Matches the Node version of your cloud app

      - name: Install API Dependencies
        run: |
          cd api
          npm install

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: 'CustomerApp' # The exact name of your standalone function in Azure
          package: './api'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          # ─── ADD THESE TWO LINES FOR FLEX CONSUMPTION COMPLIANCE ───
          sku: 'flexconsumption'
          remote-build: true
